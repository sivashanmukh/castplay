name: stats
on:
  schedule: [{ cron: '17 6 * * 1' }]   # Mondays: GitHub traffic only keeps 14 days
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./tools/stats.sh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/history.csv
          git diff --staged --quiet || git commit -m "stats: $(date -u +%Y-%m-%d)"
          git push
