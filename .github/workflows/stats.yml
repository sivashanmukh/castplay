name: stats
on:
  push:
    paths:
      - .github/workflows/stats.yml
      - tools/stats.sh
  schedule:
    - cron: '17 6 * * 1'   # Mondays: GitHub traffic only keeps 14 days
  workflow_dispatch:
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect
        run: ./tools/stats.sh
        env:
          # STATS_TOKEN (a PAT with administration:read) unlocks the traffic columns;
          # without it the run still collects npm, CDN and stars.
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: Commit the row
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats/history.csv
          git diff --staged --quiet || git commit -m "stats: $(date -u +%Y-%m-%d)"
          git push
